<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>قد أفلح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e14;
    --surface: #131a24;
    --border: #232d3a;
    --text: #e9e6df;
    --text-dim: #8b96a3;
    --text-faint: #5b6673;
    --accent: #c9a66b;
    --accent-soft: #8c7245;
    --accent-wash: rgba(201,166,107,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #10161f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app{ max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 22px 20px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; min-height: 40px; margin-bottom: 6px; }
  .backbtn{
    display:flex; align-items:center; gap:6px; background:none; border:none;
    color: var(--text-dim); font-family:'Tajawal',sans-serif; font-size: 15px; font-weight: 500;
    padding: 8px 4px; cursor:pointer; opacity:0; pointer-events:none; transition: opacity .2s, color .2s;
  }
  .backbtn.show{ opacity:1; pointer-events:auto; }
  .backbtn:active{ color: var(--accent); }
  .backbtn svg{ width:16px; height:16px; transform: scaleX(-1); }
  .crumb{ font-size: 12px; color: var(--text-faint); font-weight: 500; text-align: left; direction: rtl; max-width: 60%; }

  .screen{ display:none; animation: rise .28s ease; }
  .screen.active{ display:block; }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform: translateY(0);} }

  /* HOME */
  .home-hero{ text-align:center; padding: 40px 6px 26px; }
  .home-hero h1{ font-size: 40px; font-weight: 900; margin: 0 0 10px; }
  .home-hero p{ color: var(--text-dim); font-size: 15px; line-height: 1.9; max-width: 320px; margin: 0 auto; }
  .home-list{ display:flex; flex-direction:column; gap: 12px; margin-top: 26px; }
  .home-btn{
    display:flex; align-items:center; justify-content:space-between; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; cursor:pointer; text-align:right; transition: border-color .2s, transform .15s, background .2s;
  }
  .home-btn:active{ transform: scale(0.98); }
  .home-btn.ready:active{ background: var(--accent-wash); border-color: var(--accent-soft); }
  .home-btn .label{ font-size: 18px; font-weight: 700; }
  .home-btn .sub{ font-size: 12.5px; color: var(--text-faint); margin-top: 4px; }
  .home-btn .chev{ color: var(--text-faint); font-size: 18px; flex-shrink:0; }
  .home-btn.soon{ opacity: 0.45; cursor: default; }
  .home-btn .badge{ font-size: 11px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; flex-shrink:0; }

  /* INTRO */
  .intro-card{ background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px 22px; margin-top: 18px; line-height: 2.1; font-size: 16px; }
  .intro-card .line{ margin-bottom: 4px; }
  .title-block{ text-align:center; margin: 8px 0 4px; }
  .title-block h2{ font-size: 24px; font-weight:800; margin:0 0 6px; }
  .title-block p{ color: var(--text-faint); font-size: 13px; margin:0; }
  .cta{
    display:block; width:100%; margin-top: 22px; padding: 16px; border-radius: 14px; border: none;
    background: var(--accent); color: #14100a; font-family:'Tajawal',sans-serif; font-size: 16px; font-weight: 800;
    cursor: pointer; transition: transform .15s, filter .2s;
  }
  .cta:active{ transform: scale(0.98); filter: brightness(0.95); }

  .question{ text-align:center; font-size: 17px; font-weight: 700; margin: 22px 4px 16px; line-height: 1.8; }

  /* LEVEL 1 - plain list, no icons */
  .list1{ display:flex; flex-direction:column; gap: 10px; }
  .fadila-btn{
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; cursor:pointer; text-align:right; font-size: 15.5px; font-weight: 600;
    line-height: 1.7; transition: border-color .2s, background .2s, transform .15s;
  }
  .fadila-btn:active{ transform: scale(0.98); background: var(--accent-wash); border-color: var(--accent-soft); }

  .chosen-pill{ background: var(--accent-wash); border: 1px solid var(--accent-soft); border-radius: 14px; padding: 12px 16px; margin-bottom: 6px; }
  .chosen-pill .tag{ font-size: 10.5px; color: var(--text-faint); font-weight:500; display:block; margin-bottom:2px; }
  .chosen-pill .tx{ font-size: 14.5px; font-weight:700; color: var(--accent); line-height:1.6; }

  .list2{ display:flex; flex-direction:column; gap: 10px; }
  .amal-btn{
    display:flex; align-items:center; justify-content:space-between; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; cursor:pointer;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .amal-btn:active{ transform: scale(0.98); background: var(--accent-wash); border-color: var(--accent-soft); }
  .amal-btn .lb{ font-size: 15.5px; font-weight:600; }
  .amal-btn .chev{ color: var(--text-faint); font-size:16px; }

  .chosen-trail{ display:flex; flex-direction:column; gap:8px; margin-bottom: 4px; }
  .source-card{ margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 20px 18px; position: relative; overflow:hidden; }
  .source-card::before{ content:""; position:absolute; top:0; bottom:0; right:0; width:3px; background: var(--accent); }
  .source-card + .source-card{ margin-top: 12px; }
  .source-card .txt{ font-size: 16px; line-height: 2.1; }
  .source-card .cite{ margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--accent); font-weight: 700; text-align:left; direction: rtl; }

  .end-actions{ display:flex; gap:10px; margin-top: 20px; }
  .end-actions button{ flex:1; padding: 14px; border-radius: 14px; font-family:'Tajawal',sans-serif; font-size: 14.5px; font-weight: 700; cursor:pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .end-actions button.primary{ background: var(--accent); color: #14100a; border: none; }
  .end-actions button:active{ transform: scale(0.97); }

  .footer-note{ text-align:center; color: var(--text-faint); font-size: 11.5px; margin-top: 40px; }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <button class="backbtn" id="backBtn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      الرجوع
    </button>
    <div class="crumb" id="crumb"></div>
  </div>

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="home-hero">
      <h1>قد أفلح</h1>
    </div>
    <div class="home-list">
      <div class="home-btn ready" onclick="goIntro()">
        <div><div class="label">صفقات رابحة</div></div>
        <div class="chev">‹</div>
      </div>
      <div class="home-btn soon">
        <div><div class="label">— — — —</div></div>
        <div class="badge">قريبًا</div>
      </div>
      <div class="home-btn soon">
        <div><div class="label">— — — —</div></div>
        <div class="badge">قريبًا</div>
      </div>
    </div>
  </section>


  <section class="screen" id="screen-intro">
    <div class="title-block"><h2>صفقات رابحة</h2></div>
    <div class="intro-card">
      <div class="line">مش لازم تعمل كل دول</div>
      <div class="line"> دي فضائل وما يوصل لها</div>
      <div class="line">وانتا شوف حابب ايه من الفضل والثواب</div>
      <div class="line">وشوف الطريق الاقرب والأسهل ليك</div>
      <div class="line">(كذا عبادة بيوصلوا لنفس الفضل)</div>
    </div>
    <button class="cta" onclick="goLevel1()">يلا نبدأ</button>
  </section>

  <!-- LEVEL 1: فضائل -->
  <section class="screen" id="screen-l1">
    <div class="question">تحب ايه يكون من نصيبك من دول</div>
    <div class="list1" id="list1"></div>
  </section>

  <!-- LEVEL 2: اعمال -->
  <section class="screen" id="screen-l2">
    <div class="chosen-pill" id="pillL1"></div>
    <div class="question" style="margin-top:18px;">اختار حاجة سهلة أو بتحبها من الأعمال دي</div>
    <div class="list2" id="list2"></div>
  </section>

  <!-- LEVEL 3: مصدر -->
  <section class="screen" id="screen-l3">
    <div class="chosen-trail" id="trailL3"></div>
    <div id="sourcesWrap"></div>
    <div class="end-actions">
      <button onclick="goLevel1()">فضل تاني</button>
      <button class="primary" onclick="goHome()">الرئيسية</button>
    </div>
  </section>

</div>

<script>

    {t:"عن الطفيل بن أبي بن كعب عن أبيه، قال للنبي صلى الله عليه وسلم: كم أجعَلُ لك مِن صلاتي؟ قال: «ما شئتَ». قال: الثُّلُثَ؟ قال: «ما شئتَ، وإن زِدتَ فهو أفضلُ». قال: النِّصفَ؟ قال: «ما شئتَ، وإن زِدتَ فهو أفضلُ». قال: فكلَّها. قال: «إذًا يَكفيكَ اللهُ همَّكَ، ويَغفِرْ لكَ ذنبَكَ»", c:"أخرجه البيهقي"}

  {n:"استغفر الله", src:[
    {t:"عن ابن عباس رضي الله عنهما، أنه حدَّثه، قال: قال رسول الله صلى الله عليه وسلم: «مَن لزِمَ الِاستغفارَ، جعَل اللهُ له مِن كلِّ ضيقٍ مَخرَجًا، ومِن كلِّ همٍّ فرَجًا، ورزَقَه مِن حيثُ لا يَحتسِبُ»", c:"أبو داود"}
  ]},
  {n:"القران", src:[
    {t:"قال الله تعالى: (يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ (57) قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ (58))", c:"سورة يونس"}

{ f:"الايمان بالله و القضاء و القدر", amal:[

{ f:"التفريج عن مسلم", amal:[
  {n:"التفريج عن مسلم", src:[
    {t:"عن عبدالله بن عمرو قال: قال رسول الله صلى الله عليه وسلم: «الرَّاحِمونَ يرحَمُهمُ الرَّحمنُ، ارحَمُوا مَن في الأرضِ يرحَمْكُم مَن في السَّماءِ، الرَّحِمُ شِجْنَةٌ مِنَ الرَّحمنِ، فمَن وصَلَها وصَلَه اللهُ، ومَن قطَعَها قطَعَه اللهُ»", c:"الترمذي"}

  ]},
  {n:"القران", src:[
    {t:"قال الله تعالى: (يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ (57) قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ (58))", c:"سورة يونس"},
    {t:"قال الله تعالى: (قَدْ جَاءَكُمْ مِنَ اللَّهِ نُورٌ وَكِتَابٌ مُبِينٌ (15) يَهْدِي بِهِ اللَّهُ مَنِ اتَّبَعَ رِضْوَانَهُ سُبُلَ السَّلَامِ وَيُخْرِجُهُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ بِإِذْنِهِ وَيَهْدِيهِمْ إِلَى صِرَاطٍ مُسْتَقِيمٍ)", c:"سورة المائدة"}

{ f:"ان تضع الملائكة رضا لي و ان يستغفر لي من في السماوات و الارض", amal:[
  {n:"ان اطلب العلم", src:[
    {t:"عن قيس بن كثير عن أبي الدرداء رضي الله عنه، عن رسول الله صلى الله عليه وسلم أنه قال: «مَن سلَكَ طريقًا يطلُبُ فيه عِلمًا، سلَكَ اللهُ به طريقًا إلى الجنَّةِ، وإنَّ الملائكةَ لتضَعُ أجنِحتَها رِضًا لطالبِ العلمِ، وإنَّ العالِمَ ليَستغفِرُ له مَن في السَّماواتِ ومَن في الأرضِ، حتى الحيتانُ في الماءِ، وفضلُ العالِمِ على العابدِ كفضلِ القمرِ على سائرِ الكواكبِ، وإنَّ العلماءَ ورَثةُ الأنبياءِ، إنَّ الأنبياءَ لم يُوَرِّثوا دينارًا ولا درهمًا، وإنَّما وَرَّثوا العلمَ، فمَن أخَذَ به أخَذَ بحظٍّ وافرٍ»", c:"أخرجه أحمد"}
  ]}
]},

{ f:"ان يرفعني الله درجات", amal:[
  {n:"ان اطلب العلم", src:[
    {t:"قال الله تعالى: (يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ)", c:"سورة المجادلة"}
  ]},
  {n:"الوضوء و الصلاة في المسجد", src:[
    {t:"عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «ألَا أدُلُّكم على ما يمحو اللهُ به الخطايا، ويرفَعُ به الدَّرَجاتِ؟». قالوا: بلى، يا رسولَ اللهِ! قال: «إسباغُ الوضوءِ على المكارِهِ، وكثرةُ الخُطا إلى المساجدِ، وانتظارُ الصَّلاةِ بعدَ الصَّلاةِ، فذلكم الرِّباطُ»", c:""}
  ]},
  {n:"الصلاة على النبي", src:[
    {t:"عن أنس بن مالك قال: حدثنا بريد بن أبي مريم قال قال رسول الله صلى الله عليه وسلم: «مَن صلَّى عليَّ صلاةً واحدةً، صلَّى اللهُ عليه عَشرَ صلواتٍ، وحُطَّتْ عنه عَشرُ خطيئاتٍ، ورُفِعَتْ له عَشرُ درجاتٍ»", c:"النسائي"}
  ]},
  {n:"القران", src:[
    {t:"عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «يَجيءُ القرآنُ يومَ القيامةِ فيقولُ: يا ربِّ حَلِّه، فيُلبَسُ تاجَ الكرامةِ، ثم يقولُ: يا ربِّ زِدْه، فيُلبَسُ حُلَّةَ الكرامةِ، ثم يقولُ: يا ربِّ ارضَ عنه، فيَرضى عنه، فيُقالُ له: اقرَأْ وارقَ، وتُزادُ بكلِّ آيةٍ حسنةً»", c:"الترمذي"},
    {t:"عن عائشة رضي الله عنها قالت: قال رسول الله صلى الله عليه وسلم: «الماهرُ بالقرآنِ مع السَّفَرةِ الكرامِ البَرَرةِ، والَّذي يقرأُ القرآنَ ويتَتَعتَعُ فيه، وهو عليه شاقٌّ، له أجرانِ»", c:"متفق عليه"}
  ]},
  {n:"الصلاة", src:[
    {t:"عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «صلاةُ الجميعِ تزيدُ على صلاتِه في بيتِه وصلاتِه في سوقِه خمسًا وعشرينَ درجةً، فإنَّ أحدَكم إذا توضَّأَ فأحسَنَ، وأتى المسجدَ لا يريدُ إلا الصَّلاةَ، لم يخطُ خطوةً إلا رُفِعَ له بها درجةٌ، وحُطَّ عنه بها خطيئةٌ، حتى يدخُلَ المسجدَ، وإذا دخَل المسجدَ كان في صلاةٍ ما كانتْ تحبِسُه، وتُصلِّي عليه الملائكةُ ما دام في مجلِسِه الَّذي يُصلِّي فيه: اللهمَّ اغفِرْ له، اللهمَّ ارحَمْه، ما لم يُحدِثْ فيه»", c:"متفق عليه"}
  ]},
  {n:"قيام الليل", src:[
    {t:"قال الله تعالى: (وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَكَ عَسَى أَنْ يَبْعَثَكَ رَبُّكَ مَقَامًا مَحْمُودًا) (79)", c:"سورة الإسراء: 79"}
  ]}
]},

{ f:"ان يحرمني الله على النار", amal:[
  {n:"ان اشهد ان لا اله الا الله و ان محمدا رسول الله", src:[
    {t:"عن أنس بن مالك رضي الله عنه أن نبي الله صلى الله عليه وسلم، ومعاذ بن جبل رديفُه على الرَّحلِ، قال: «يا معاذُ!» قال: لبَّيكَ رسولَ اللهِ وسعدَيكَ. قال: «يا معاذُ!» قال: لبَّيكَ رسولَ اللهِ وسعدَيكَ (ثلاثًا). قال: «ما مِن عبدٍ يشهَدُ أن لا إلَه إلَّا اللهُ، وأنَّ محمَّدًا عبدُه ورسولُه، إلَّا حرَّمَه اللهُ على النَّارِ». قال: يا رسولَ اللهِ! أفلا أُخبِرُ بها النَّاسَ فيَستبشِروا؟ قال: «إذًا يتَّكِلوا». فأخبَرَ بها معاذٌ عند موتِه، تأثُّمًا", c:"متفق عليه"}
  ]}
]},

{ f:"ان يباعد الله بيني وبين النار و افرح حين القى الله", amal:[
  {n:"اصوم يوما تطوعا", src:[
    {t:"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «قال اللهُ: كلُّ عملِ ابنِ آدمَ له إلَّا الصِّيامَ، فإنَّه لي وأنا أجزي به، والصِّيامُ جُنَّةٌ، وإذا كان يومُ صومِ أحدِكم فلا يرفُثْ ولا يصخَبْ، فإن سابَّه أحدٌ أو قاتَله فليَقُلْ: إنِّي امرؤٌ صائمٌ، والَّذي نفْسُ محمَّدٍ بيَدِه، لَخُلوفُ فمِ الصَّائمِ أطيَبُ عندَ اللهِ مِن ريحِ المِسكِ، للصَّائمِ فرحَتانِ يفرَحُهما: إذا أفطَر فرِحَ، وإذا لقيَ ربَّه فرِحَ بصومِه»", c:"متفق عليه"},
    {t:"«فصُمْ وأفطِرْ، ونَمْ وقُمْ، وصُمْ مِنَ الشَّهرِ ثلاثةَ أيَّامٍ، فإنَّ الحسنةَ بعشرِ أمثالِها، وذلك مِثلُ صيامِ الدَّهرِ»", c:""},
    {t:"عن أبي هريرة رضي الله عنه قال: أوصاني خليلي بثلاثٍ: «صيامِ ثلاثةِ أيَّامٍ مِن كلِّ شهرٍ، وركعتَي الضُّحى، وأنْ أُوتِرَ قبلَ أن أنامَ»", c:"متفق عليه"},
    {t:"عن أبي سعيد الخدري رضي الله عنه قال: سمعتُ النبي صلى الله عليه وسلم يقول: «مَن صامَ يومًا في سبيلِ اللهِ، بعَّدَ اللهُ وجهَه عنِ النَّارِ سبعينَ خريفًا»", c:"متفق عليه"},
    {t:"عن عقبة بن عامر عن رسول الله صلى الله عليه وسلم قال: «مَن صامَ يومًا في سبيلِ اللهِ عزَّ وجلَّ، باعَدَ اللهُ منه جهنَّمَ مسيرةَ مائةِ عامٍ»", c:"النسائي"},
    {t:"عن أبي أمامة عن نبي الله صلى الله عليه وسلم قال: «مَن صامَ يومًا في سبيلِ اللهِ، باعدَه اللهُ مِن جهنَّمَ مائةَ عامٍ، رَكْضَ الفرسِ الجَوادِ المُضَمَّرِ»", c:"الطبراني"},
    {t:"عن أبي أمامة عن نبي الله صلى الله عليه وسلم قال: «مَن صامَ يومًا في سبيلِ اللهِ، جعَل اللهُ بينَه وبينَ النَّارِ خندقًا كما بينَ السَّماءِ والأرضِ»", c:"الطبراني"}
  ]}
]},

{ f:"نزلا في الجنة", amal:[
  {n:"الصلاة في المسجد", src:[
    {t:"عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «مَن غدا إلى المسجدِ أو راحَ، أعدَّ اللهُ له نُزُلَه مِنَ الجنَّةِ، كلَّما غدا أو راحَ»", c:"متفق عليه"}
  ]},
  {n:"ذكر يسير لأكون من اهل الجنة", src:[
    {t:"عن شداد بن أوس رضي الله عنه عن النبي صلى الله عليه وسلم قال: «سيِّدُ الاستغفارِ أن تقولَ: اللهمَّ أنتَ ربِّي لا إلَه إلَّا أنتَ، خلَقْتَني وأنا عبدُكَ، وأنا على عهدِكَ ووعدِكَ ما استطعْتُ، أعوذُ بكَ مِن شرِّ ما صنعْتُ، أبوءُ لكَ بنِعمتِكَ عليَّ، وأبوءُ بذنبي فاغفِرْ لي، فإنَّه لا يغفِرُ الذُّنوبَ إلَّا أنتَ». قال: «ومَن قالَها مِنَ النَّهارِ مُوقِنًا بها، فماتَ مِن يومِه قبلَ أن يُمسيَ، فهو مِن أهلِ الجنَّةِ، ومَن قالَها مِنَ اللَّيلِ وهو مُوقِنٌ بها، فماتَ قبلَ أن يُصبِحَ، فهو مِن أهلِ الجنَّةِ»", c:"أخرجه البخاري"}
  ]}
]},

{ f:"اجر كقيام الليل كله", amal:[
  {n:"صلاة العشاء والفجر في جماعة", src:[
    {t:"عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «مَن غدا إلى المسجدِ أو راحَ، أعدَّ اللهُ له نُزُلَه مِنَ الجنَّةِ، كلَّما غدا أو راحَ»", c:"متفق عليه"}
  ]}
]},

{ f:"ان اجمع خير الدنيا والاخرة", amal:[
  {n:"دعاء وصى به النبي صلى الله عليه و سلم", src:[
    {t:"عن طارق بن أشيم رضي الله عنه أنه سمع النبي صلى الله عليه وسلم، وأتاه رجل فقال: يا رسول الله! كيف أقول حين أسأل ربي؟ قال: «قُلِ: اللهمَّ اغفِرْ لي وارحَمْني وعافِني وارزُقْني، فإنَّ هؤلاءِ تجمَعُ لكَ دُنياكَ وآخرتَكَ»", c:"أخرجه مسلم"}
  ]},
  {n:"ان اذكر الله", src:[
    {t:"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لَأنْ أقولَ: سُبحانَ اللهِ، والحمدُ للهِ، ولا إلَه إلَّا اللهُ، واللهُ أكبرُ، أحبُّ إليَّ ممَّا طلَعَتْ عليه الشَّمسُ»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"قراءة وتعلم القرءان", amal:[
  {n:"قراءة وتعلم القرءان", src:[
    {t:"عن عقبة بن عامر رضي الله عنه قال: خرج رسول الله صلى الله عليه وسلم ونحن في الصُّفَّةِ، فقال: «أيُّكم يُحِبُّ أن يغدوَ كلَّ يومٍ إلى بُطحانَ أو إلى العَقيقِ، فيأتيَ منه بناقتَينِ كوماوَينِ، في غيرِ إثمٍ ولا قطعِ رَحِمٍ؟». فقلنا: يا رسولَ اللهِ! نُحِبُّ ذلك. قال: «أفلا يغدو أحدُكم إلى المسجدِ، فيَعلَمَ أو يقرأَ آيتَينِ مِن كتابِ اللهِ عزَّ وجلَّ، خيرٌ له مِن ناقتَينِ، وثلاثٌ خيرٌ له مِن ثلاثٍ، وأربعٌ خيرٌ له مِن أربعٍ، ومِن أعدادِهنَّ مِنَ الإبلِ؟»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"رزق وفير و اموال وبنين وجنات و انهار", amal:[
  {n:"استغفر الله", src:[
    {t:"قال الله تعالى: (فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا (10) يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا (11) وَيُمْدِدْكُمْ بِأَمْوَالٍ وَبَنِينَ وَيَجْعَلْ لَكُمْ جَنَّاتٍ وَيَجْعَلْ لَكُمْ أَنْهَارًا (12))", c:"سورة نوح"}
  ]},
  {n:"صلة الأرحام", src:[
    {t:"عن أنس بن مالك رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «مَن أحبَّ أن يُبسَطَ له في رزقِه، ويُنسَأَ له في أثرِه، فليَصِلْ رحِمَه»", c:"متفق عليه"},
    {t:"عن عبدالله بن عمرو رضي الله عنه عن النبي صلى الله عليه وسلم قال: «ليس الواصلُ بالمُكافِئِ، ولكنَّ الواصلَ الَّذي إذا قُطِعَتْ رحِمُه وصَلَها»", c:"أخرجه البخاري"}
  ]}
]},

{ f:"ان انال الشفاعة يوم القيامة", amal:[
  {n:"أسأل الوسيلة للنبي عليه الصلاة و السلام", src:[
    {t:"عن جابر بن عبدالله رضي الله عنهما أن رسول الله صلى الله عليه وسلم قال: «مَن قال حينَ يسمَعُ النِّداءَ: اللهمَّ ربَّ هذه الدَّعوةِ التَّامَّةِ، والصَّلاةِ القائمةِ، آتِ محمَّدًا الوَسيلةَ والفضيلةَ، وابعَثْه مَقامًا محمودًا الَّذي وعدْتَه، حلَّتْ له شفاعَتي يومَ القيامةِ»", c:"أخرجه البخاري"}
  ]},
  {n:"ان اقرأ القران", src:[
    {t:"عن أبي أمامة الباهلي رضي الله عنه قال: سمعتُ رسول الله صلى الله عليه وسلم يقول: «اقرَؤوا القرآنَ، فإنَّه يأتي يومَ القيامةِ شفيعًا لأصحابِه، اقرَؤوا الزَّهراوَينِ: البقرةَ، وسورةَ آلِ عِمرانَ، فإنَّهما تأتيانِ يومَ القيامةِ كأنَّهما غَمامتانِ، أو كأنَّهما غَيايتانِ، أو كأنَّهما فِرقانِ مِن طيرٍ صَوافَّ، تُحاجَّانِ عن أصحابِهما، اقرَؤوا سورةَ البقرةِ، فإنَّ أخذَها بركةٌ، وتركَها حسرةٌ، ولا تستطيعُها البَطَلةُ»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"ما يساوي عشر رقاب ومائة حسنة ويغفر لي مائة سيئة ويكون لي حرز من الشيطان", amal:[
  {n:"ذكر خاص", src:[
    {t:"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَن قال: لا إلَه إلَّا اللهُ وحدَه لا شريكَ له، له المُلكُ وله الحمدُ، وهو على كلِّ شيءٍ قديرٌ، في يومٍ مائةَ مرَّةٍ، كانتْ له عَدلَ عَشرِ رِقابٍ، وكُتِبَتْ له مائةُ حسنةٍ، ومُحِيَتْ عنه مائةُ سيِّئةٍ، وكانتْ له حِرزًا مِنَ الشَّيطانِ يومَه ذلك حتى يُمسيَ، ولم يأتِ أحدٌ بأفضلَ ممَّا جاءَ به إلَّا أحدٌ عمِلَ أكثرَ مِن ذلك. ومَن قال: سبحانَ اللهِ وبحمدِه، في يومٍ مائةَ مرَّةٍ، حُطَّتْ خطاياه ولو كانتْ مِثلَ زَبَدِ البحرِ»", c:"متفق عليه"}
  ]}
]},

{ f:"ان امﻷ الميزان", amal:[
  {n:"سبحان الله والحمد لله", src:[
    {t:"عن أبي مالك الأشعري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «الطُّهورُ شَطرُ الإيمانِ، والحمدُ للهِ تملأُ الميزانَ، وسبحانَ اللهِ والحمدُ للهِ تملآنِ -أو تملأُ- ما بينَ السَّماواتِ والأرضِ»", c:"أخرجه مسلم"}
  ]},
  {n:"قراءة القران", src:[
    {t:"عن عبدالله بن مسعود رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَن قرأَ حرفًا مِن كتابِ اللهِ فله به حسنةٌ، والحسنةُ بعشرِ أمثالِها»", c:"الترمذي"}
  ]}
]},

{ f:"كمن اعتق اربعة انفس من ولد اسماعيل", amal:[
  {n:"ذكر يسير", src:[
    {t:"عن أبي أيوب الأنصاري رضي الله عنه عن رسول الله صلى الله عليه وسلم قال: «مَن قال: لا إلَه إلَّا اللهُ وحدَه لا شريكَ له، له المُلكُ وله الحمدُ، وهو على كلِّ شيءٍ قديرٌ، عَشرَ مِرارٍ، كان كمَن أعتَقَ أربعةَ أنفُسٍ مِن ولَدِ إسماعيلَ»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"مايجعلني اكف عن الفحشاء و المنكر", amal:[
  {n:"الصلاة", src:[
    {t:"قال الله تعالى: (اتْلُ مَا أُوحِيَ إِلَيْكَ مِنَ الْكِتَابِ وَأَقِمِ الصَّلَاةَ إِنَّ الصَّلَاةَ تَنْهَى عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَلَذِكْرُ اللَّهِ أَكْبَرُ وَاللَّهُ يَعْلَمُ مَا تَصْنَعُونَ) (45)", c:"سورة العنكبوت: 45"}
  ]},
  {n:"الذكر", src:[
    {t:"قال الله تعالى: (اتْلُ مَا أُوحِيَ إِلَيْكَ مِنَ الْكِتَابِ وَأَقِمِ الصَّلَاةَ إِنَّ الصَّلَاةَ تَنْهَى عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَلَذِكْرُ اللَّهِ أَكْبَرُ وَاللَّهُ يَعْلَمُ مَا تَصْنَعُونَ) (45)", c:"سورة العنكبوت: 45"}
  ]},
  {n:"الصدقة", src:[
    {t:"قال الله تعالى: (خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِمْ بِهَا وَصَلِّ عَلَيْهِمْ إِنَّ صَلَاتَكَ سَكَنٌ لَهُمْ وَاللَّهُ سَمِيعٌ عَلِيمٌ) (103)", c:"سورة التوبة: 103"}
  ]}
]},

{ f:"دعاء مستجاب", amal:[
  {n:"النوافل والتطوع", src:[
    {t:"يقولُ اللهُ تباركَ وتعالى: «ما تقرَّبَ إليَّ عبدي بشيءٍ أفضلَ مِن أداءِ ما افترَضْتُ عليه، وما يزالُ عبدي يتقرَّبُ إليَّ بالنَّوافلِ حتى أُحِبَّه، فإذا أحبَبْتُه كنتُ سمْعَه الَّذي يَسمَعُ به، وبصرَه الَّذي يُبصِرُ به، ويدَه الَّتي يبطِشُ بها، ورِجلَه الَّتي يمشي بها، ولئنْ سألَني لَأُعطِيَنَّه، ولئنْ دَعاني لَأُجيبَنَّه، ولئنْ استَعاذَني لَأُعيذَنَّه»", c:""}
  ]},
  {n:"الدعاء بين الأذان و الاقامة", src:[
    {t:"عن أنس بن مالك رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «الدُّعاءُ لا يُرَدُّ بينَ الأذانِ والإقامةِ»", c:"أخرجه أبو داود والترمذي"},
    {t:"قالوا: فماذا نقولُ يا رسولَ اللهِ؟ قال: «سَلوا اللهَ العافيةَ في الدُّنيا والآخرةِ»", c:"الترمذي"}
  ]}
]},

{ f:"ان اوفى اجري بغير حساب", amal:[
  {n:"الصبر", src:[
    {t:"قال الله تعالى: (إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُمْ بِغَيْرِ حِسَابٍ)", c:"سورة الزمر"}
  ]}
]},

{ f:"ان أشكر نعم الله", amal:[
  {n:"صلاة الضحى", src:[
    {t:"عن أبي ذر رضي الله عنه عن النبي صلى الله عليه وسلم أنه قال: «يُصبِحُ على كلِّ سُلامَى مِن أحدِكم صدقةٌ، فكلُّ تسبيحةٍ صدقةٌ، وكلُّ تحميدةٍ صدقةٌ، وكلُّ تهليلةٍ صدقةٌ، وكلُّ تكبيرةٍ صدقةٌ، وأمرٌ بالمعروفِ صدقةٌ، ونهيٌ عنِ المنكَرِ صدقةٌ، ويُجزئُ مِن ذلك ركعتانِ يركَعُهما مِنَ الضُّحى»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"تجارة واستثمار مضاعف", amal:[
  {n:"الصدقة", src:[
    {t:"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَن تصدَّقَ بعَدلِ تمرةٍ مِن كسْبٍ طيِّبٍ، ولا يقبَلُ اللهُ إلَّا الطَّيِّبَ، وإنَّ اللهَ يتقبَّلُها بيمينِه، ثم يُرَبِّيها لصاحبِه، كما يُرَبِّي أحدُكم فَلُوَّه، حتى تكونَ مِثلَ الجبلِ»", c:"متفق عليه"},
    {t:"قال الله تعالى: (مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ) (245)", c:"سورة البقرة"},
    {t:"قال الله تعالى: (مَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنْبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنْبُلَةٍ مِائَةُ حَبَّةٍ وَاللَّهُ يُضَاعِفُ لِمَنْ يَشَاءُ وَاللَّهُ وَاسِعٌ عَلِيمٌ) (261)", c:"سورة البقرة: 261"}
  ]}
]},

  {n:"التيسير في القرض والصدقة", src:[
    {t:"عن أبي اليسر رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَن أنظَرَ مُعسِرًا، أو وضَعَ عنه، أظلَّه اللهُ في ظِلِّه»", c:"أخرجه مسلم"},
    {t:"عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «مَن أنظَرَ مُعسِرًا، أو وضَعَ له، أظلَّه اللهُ يومَ القيامةِ تحتَ ظِلِّ عرشِه، يومَ لا ظِلَّ إلَّا ظِلُّه»", c:"الترمذي"}
  ]},
  {n:"قراءة سورتي البقرة و ال عمران", src:[
    {t:"عن أبي أمامة الباهلي رضي الله عنه قال: سمعتُ رسول الله صلى الله عليه وسلم يقول: «اقرَؤوا القرآنَ، فإنَّه يأتي يومَ القيامةِ شفيعًا لأصحابِه، اقرَؤوا الزَّهراوَينِ: البقرةَ، وسورةَ آلِ عِمرانَ، فإنَّهما تأتيانِ يومَ القيامةِ كأنَّهما غَمامتانِ، أو كأنَّهما غَيايتانِ، أو كأنَّهما فِرقانِ مِن طيرٍ صَوافَّ، تُحاجَّانِ عن أصحابِهما، اقرَؤوا سورةَ البقرةِ، فإنَّ أخذَها بركةٌ، وتركَها حسرةٌ، ولا تستطيعُها البَطَلةُ»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"منبر من نور يوم القيامة على يمين الرحمن", amal:[
  {n:"العدل في الحكم", src:[
    {t:"عن عبدالله بن عمرو رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إنَّ المُقسِطينَ عندَ اللهِ على منابرَ مِن نورٍ، عن يمينِ الرَّحمنِ عزَّ وجلَّ، وكِلتا يدَيه يمينٌ، الَّذينَ يعدِلونَ في حُكمِهم وأهليهم وما وَلُوا»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"خير من الصلاة والصيام و الصدقة", amal:[
  {n:"الاصلاح بين الناس", src:[
    {t:"عن أبي الدرداء رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «ألَا أُخبِرُكم بأفضلَ مِن دَرَجةِ الصِّيامِ والصَّلاةِ والصَّدقةِ؟». قالوا: بلى، يا رسولَ اللهِ. قال: «إصلاحُ ذاتِ البَينِ، وفسادُ ذاتِ البَينِ هيَ الحالِقةُ»", c:"أخرجه أبو داود والترمذي"}
  ]}
]},

{ f:"مع النبي في الجنة", amal:[
  {n:"كثرة السجود", src:[
    {t:"عن ربيعة بن كعب الأسلمي رضي الله عنه قال: كنتُ أبيتُ مع رسول الله صلى الله عليه وسلم فأتيتُه بوَضوئِه وحاجتِه، فقال لي: «سَلْ». فقلتُ: أسألُكَ مُرافقتَكَ في الجنَّةِ. قال: «أو غيرَ ذلك؟». قلتُ: هو ذاكَ. قال: «فأعِنِّي على نفْسِكَ بكثرةِ السُّجودِ»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"حسن الخلق", amal:[
  {n:"حسن الخلق", src:[
    {t:"قال رسول الله صلى الله عليه وسلم: «إنَّ أحبَّكم إليَّ وأقرَبَكم منِّي مجلِسًا يومَ القيامةِ: محاسِنُكم أخلاقًا»", c:"صحيح"}
  ]}
]},

{ f:"كفالة اليتيم", amal:[
  {n:"كفالة اليتيم", src:[
    {t:"عن سهل رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «أنا وكافِلُ اليتيمِ في الجنَّةِ هكذا». وأشارَ بالسَّبَّابةِ والوُسطى، وفرَّجَ بينَهما شيئًا", c:"متفق عليه"}
  ]}
]},

{ f:"ما يكفيني ويحفظني", amal:[
  {n:"قراءة اخر ايتين من سورة البقرة", src:[
    {t:"عن ابن مسعود رضي الله عنه قال: قال النبي صلى الله عليه وسلم: «مَن قرأَ بالآيتَينِ مِن آخِرِ سورةِ البقرةِ في ليلةٍ، كفتاه»", c:"متفق عليه"}
  ]},
  {n:"قراءة اية الكرسي", src:[
    {t:"عن أبي هريرة رضي الله عنه قال: وكَّلَني رسول الله صلى الله عليه وسلم بحفظِ زكاةِ رمضانَ، فأتاني آتٍ فجعَل يَحثو مِنَ الطَّعامِ، فأخذْتُه فقلتُ: لَأرفَعَنَّكَ إلى رسولِ اللهِ صلى الله عليه وسلم. فقَصَّ الحديثَ، فقال: «إذا أوَيْتَ إلى فِراشِكَ فاقرَأْ آيةَ الكرسيِّ، لن يزالَ معَكَ مِنَ اللهِ حافظٌ، ولا يقرَبُكَ شيطانٌ حتى تُصبِحَ». وقال النبي صلى الله عليه وسلم: «صدَقَكَ وهو كذوبٌ، ذاكَ شيطانٌ»", c:"أخرجه البخاري معلقًا ووصله النسائي"}
  ]},
  {n:"حفظ اول عشر ايات من سورة الكهف", src:[
    {t:"عن أبي الدرداء رضي الله عنه أن النبي صلى الله عليه وسلم قال: «مَن حفِظَ عَشرَ آياتٍ مِن أوَّلِ سورةِ الكهفِ، عُصِمَ مِنَ الدَّجَّالِ»", c:"أخرجه مسلم"}
  ]}
]},

{ f:"ضياء من الجمعة للجمعة", amal:[
  {n:"قراءة سورة الكهف يوم الجمعة", src:[
    {t:"عن أبي سعيد الخدري رضي الله عنه أن النبي صلى الله عليه وسلم قال: «مَن قرأَ سورةَ الكهفِ في يومِ الجمعةِ، أضاءَ له مِنَ النُّورِ ما بينَ الجُمعتَينِ»", c:"أخرجه البيهقي"}
  ]}
]},

{ f:"كالمجاهد او القائم الصائم", amal:[
  {n:"السعي على الأرملة", src:[
    {t:"عن أبي هريرة رضي الله عنه قال: قال النبي صلى الله عليه وسلم: «السَّاعي على الأرملةِ والمِسكينِ، كالمُجاهدِ في سبيلِ اللهِ، أو كالقائمِ اللَّيلَ الصَّائمِ النَّهارَ»", c:"متفق عليه"}
  ]}
]}
];

// ---------- STATE ----------
let stack = ["home"];
let selL1 = null;
let selL2 = null;

const screens = ["home","intro","l1","l2","l3"];
function showScreen(name){
  screens.forEach(s=>{ document.getElementById("screen-"+s).classList.toggle("active", s===name); });
  document.getElementById("backBtn").classList.toggle("show", stack.length>1);
  updateCrumb(name);
  window.scrollTo({top:0, behavior:"instant"});
}

function updateCrumb(name){
  const el = document.getElementById("crumb");
  if(name==="l2" && selL1!==null){
    const f = DATA[selL1].f;
    el.textContent = f.length>26 ? f.slice(0,26)+"…" : f;
  } else if(name==="l3" && selL1!==null && selL2!==null){
    const n = DATA[selL1].amal[selL2].n;
    el.textContent = n.length>26 ? n.slice(0,26)+"…" : n;
  } else {
    el.textContent = "";
  }
}

function goHome(){ stack=["home"]; render(); }
function goIntro(){ stack.push("intro"); render(); }
function goLevel1(){ if(stack[stack.length-1] !== "l1") stack.push("l1"); render(); }
function goBack(){ if(stack.length>1){ stack.pop(); render(); } }

function render(){
  const cur = stack[stack.length-1];
  if(cur==="l1") buildL1();
  if(cur==="l2") buildL2();
  if(cur==="l3") buildL3();
  showScreen(cur);
}

function buildL1(){
  const list = document.getElementById("list1");
  list.innerHTML = "";
  DATA.forEach((item, idx)=>{
    const btn = document.createElement("div");
    btn.className = "fadila-btn";
    btn.textContent = item.f;
    btn.onclick = ()=>{ selL1 = idx; selL2=null; stack.push("l2"); render(); };
    list.appendChild(btn);
  });
}

function buildL2(){
  const pill = document.getElementById("pillL1");
  const item = DATA[selL1];
  pill.innerHTML = `<span class="tag">اخترت</span><div class="tx">${item.f}</div>`;
  const list = document.getElementById("list2");
  list.innerHTML = "";
  item.amal.forEach((a, idx)=>{
    const btn = document.createElement("div");
    btn.className = "amal-btn";
    btn.innerHTML = `<div class="lb">${a.n}</div><div class="chev">‹</div>`;
    btn.onclick = ()=>{ selL2 = idx; stack.push("l3"); render(); };
    list.appendChild(btn);
  });
}

function buildL3(){
  const item = DATA[selL1];
  const a = item.amal[selL2];
  const trail = document.getElementById("trailL3");
  trail.innerHTML = `
    <div class="chosen-pill"><span class="tag">الفضل</span><div class="tx">${item.f}</div></div>
    <div class="chosen-pill"><span class="tag">العمل</span><div class="tx">${a.n}</div></div>
  `;
  const wrap = document.getElementById("sourcesWrap");
  wrap.innerHTML = "";
  a.src.forEach(s=>{
    const card = document.createElement("div");
    card.className = "source-card";
    card.innerHTML = `<div class="txt">${s.t}</div>` + (s.c ? `<div class="cite">${s.c}</div>` : "");
    wrap.appendChild(card);
  });
}

render();
</script>
